name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main push CI run ID to publish/deploy
        required: true

permissions:
  contents: read
  actions: read

# CI may cancel obsolete tests; a running deployment must finish or roll back.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.repository == 'MertcanBakir/TradingAgents' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.validate.outputs.eligible }}
      sha: ${{ steps.validate.outputs.sha }}
      run_id: ${{ steps.validate.outputs.run_id }}
      attempt: ${{ steps.validate.outputs.attempt }}
      artifact: ${{ steps.validate.outputs.artifact }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate trusted run, CI gate, attempt, artifact and current main
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python3 deploy/personal/cd_pipeline.py prepare "$CI_RUN_ID"

  publish:
    needs: candidate
    if: ${{ needs.candidate.outputs.eligible == 'true' && vars.AWS_PUBLISH_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: image-publish
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      CI_SHA: ${{ needs.candidate.outputs.sha }}
      CI_RUN_ID: ${{ needs.candidate.outputs.run_id }}
      CI_ATTEMPT: ${{ needs.candidate.outputs.attempt }}
      IMAGE_TAG: ${{ needs.candidate.outputs.tag }}
      ECR_IMAGE: 500888846202.dkr.ecr.eu-west-1.amazonaws.com/lucrari/tradingagents-personal
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: runtime-image
          run-id: ${{ needs.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and load the exact tested image before AWS login
        run: python3 deploy/personal/cd_pipeline.py load runtime-image
      - name: Reject obsolete main commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/personal/cd_pipeline.py current "$CI_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: '500888846202'
      - name: Publish to the dedicated ECR repository and resolve its digest
        id: push
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_IMAGE%%/*}"
          docker tag tradingagents-worker:ci "${ECR_IMAGE}:${IMAGE_TAG}"
          if ! aws ecr describe-images --repository-name lucrari/tradingagents-personal --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            docker push "${ECR_IMAGE}:${IMAGE_TAG}"
          fi
          python3 deploy/personal/cd_pipeline.py published runtime-image
          digest=$(aws ecr describe-images --repository-name lucrari/tradingagents-personal --image-ids "imageTag=${IMAGE_TAG}" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published commit: \`$CI_SHA\` — digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [candidate, publish]
    # Kept false during initial setup. Enable only after first-live approval.
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI_SHA: ${{ needs.candidate.outputs.sha }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject obsolete main commits before touching EC2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/personal/cd_pipeline.py current "$CI_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: '500888846202'
      - name: Deploy through the restricted SSM document and verify completion
        run: python3 deploy/personal/deploy_request.py
