name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        tz: [UTC]
        # One run away from UTC, so a test that only passes in UTC fails here.
        include:
          - python-version: "3.12"
            tz: America/New_York
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev and backend extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backend]"
          python -m pip check
      - name: Run test suite
        if: matrix.python-version != '3.13'
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Run test suite with branch coverage
        if: matrix.python-version == '3.13'
        env:
          COVERAGE_FILE: test-results/coverage-unit
        run: |
          python -m pip install coverage==7.17.0
          mkdir -p test-results
          python -m coverage run -m pytest -q --junitxml=test-results/junit.xml
      - name: Upload unit coverage data
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: test-results/coverage-unit
          if-no-files-found: error
          retention-days: 14
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-py${{ matrix.python-version }}-${{ matrix.tz == 'America/New_York' && 'new-york' || 'utc' }}
          path: test-results/junit.xml
          retention-days: 14
          if-no-files-found: warn

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and test the installed wheel outside the checkout
        env:
          TRADINGAGENTS_NO_UPDATE_CHECK: '1'
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          bin="$RUNNER_TEMP/wheel-smoke/bin"
          "$bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
          "$bin/python" -m pip check
          "$bin/python" -c "import tradingagents, cli.main"
          "$bin/tradingagents" --help

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .
      - name: Validate deployment document JSON
        run: |
          python -m json.tool deploy/personal/cd-infrastructure.json >/dev/null
          python -m json.tool deploy/personal/ssm-deploy.json >/dev/null

  database-migrations:
    name: database migration acceptance (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migration-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:migration-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install migration test dependencies
        run: pip install -e '.[dev,backend]' coverage==7.17.0
      - name: Validate manifest and run PostgreSQL acceptance
        env:
          COVERAGE_FILE: test-results/coverage-postgres
        run: |
          mkdir -p test-results
          python deploy/personal/migrate.py --directory deploy/migrations --validate
          python -m coverage run -m pytest -m integration -q \
            tests/test_database_migrations_postgres.py tests/test_provider_connections_postgres.py \
            tests/test_hosted_backend_postgres.py --junitxml=test-results/junit-migrations.xml
      - name: Upload PostgreSQL coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-postgres
          path: test-results/coverage-postgres
          if-no-files-found: error
          retention-days: 14
      - name: Upload migration acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-database-migrations
          path: test-results/junit-migrations.xml
          retention-days: 14
          if-no-files-found: warn

  coverage:
    name: coverage report
    if: ${{ !cancelled() }}
    needs: [test, database-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-unit
          path: test-results/unit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-postgres
          path: test-results/postgres
      - name: Combine Python and PostgreSQL line and branch coverage
        run: |
          python -m pip install coverage==7.17.0 diff-cover==11.0.0
          python -m coverage combine test-results/unit/coverage-unit test-results/postgres/coverage-postgres
          python -m coverage report --format=markdown > test-results/coverage.md
          python -m coverage xml -o test-results/coverage.xml
          python -m coverage html -d test-results/coverage-html
          {
            echo '## Combined Python and PostgreSQL coverage'
            echo
            head -n 2 test-results/coverage.md
            tail -n 1 test-results/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          diff-cover test-results/coverage.xml --compare-branch "$BASE_SHA" \
            --branch-coverage --format markdown:test-results/diff-coverage.md
          {
            echo "## Changed lines (partial branches count as uncovered)"
            cat test-results/diff-coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            test-results/coverage.md
            test-results/coverage.xml
            test-results/coverage-html/
            test-results/diff-coverage.md
          if-no-files-found: error
          retention-days: 14

  worker-image:
    name: production image (ARM64)
    # Match the EC2 architecture without emulation. No AWS access or registry push.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the worker test runner with pinned Python 3.13 dependencies
        run: |
          docker build --platform linux/arm64 --file Dockerfile.worker \
            --target test-runner --tag tradingagents-worker-tests:ci .
      - name: Run tests in the ARM64 worker environment
        run: |
          docker run --name worker-ci-tests --platform linux/arm64 --network none \
            --entrypoint python tradingagents-worker-tests:ci \
            -m pytest -p no:cacheprovider -q --tb=short --junitxml=/tmp/junit-worker-arm64.xml
      - name: Collect ARM64 test report
        if: ${{ always() }}
        run: |
          mkdir -p test-results
          if docker container inspect worker-ci-tests >/dev/null 2>&1; then
            trap 'docker rm -f worker-ci-tests >/dev/null 2>&1 || true' EXIT
            docker cp worker-ci-tests:/tmp/junit-worker-arm64.xml test-results/junit-worker-arm64.xml
          fi
      - name: Upload ARM64 test report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-worker-arm64-py3.13
          path: test-results/junit-worker-arm64.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Build the production image
        run: |
          docker build --platform linux/arm64 --file Dockerfile.worker \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag tradingagents-worker:ci .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' tradingagents-worker:ci)" = "linux/arm64"
      - name: Smoke test the packaged API with production restrictions
        # Fake settings only; no network, real session, database or AWS credentials.
        run: |
          docker run --rm --platform linux/arm64 \
            --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/deploy/personal/container_smoke.py,target=/tmp/container_smoke.py,readonly" \
            --entrypoint python tradingagents-worker:ci /tmp/container_smoke.py
      - name: Export the tested production image for CD
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 deploy/personal/cd_pipeline.py package runtime-image
      - name: Upload the production image for this exact CI attempt
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-image-${{ github.sha }}-${{ github.run_attempt }}
          path: runtime-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [test, smoke-install, lint, worker-image, database-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $CHECK_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "CI failed: at least one required job failed, was cancelled or was skipped."
              exit 1
            fi
          done
